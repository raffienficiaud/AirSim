[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=80", "setuptools_scm[toml]>=3.4.3"]

[project]
authors = [
    { name = "Shital Shah", email = "shitals@microsoft.com" },
    { name = "Raffi Enficiaud", email = 'raffi.enficiaud@free.fr' }
]
description = """airsim resurected: \
    open source simulator based on Unreal Engine \
    for autonomous vehicles from Microsoft AI & Research"""
license = "MIT"
name = "airsim-simplified"
readme = "README.md"
# runtime dependencies
dependencies = [
    "numpy",
    "opencv-python",
    "msgpack-python",
    "msgpack-rpc-python",
    # "pyaudio",
    "opencv-contrib-python"
]
requires-python = ">=3.11"
# dynamic properties set by tools:
dynamic = ["version"]

[dependency-groups]
rl = ["torch", "torchrl", "gymnasium[classic_control]", "matplotlib"]
docs = [
    'nbsphinx',
    'sphinx',
    'sphinx_rtd_theme',
    'sphinx-tabs',
    "jupytext",
    "jupyterlab",
    "pandas",
    'pyarrow',
    'seaborn',
    "pygraphviz",
    "pyvista[jupyter]",
    'sphinx-design',
    "sphinx-copybutton",
    "imageio[ffmpeg]", # for pyvista, pyav not working/compiling fine

]
tests = ['pytest', 'pandas', 'pyarrow']
dev = [
    'black[jupyter]==24.4.2',
    'isort',
    'pre-commit',
    'jupyterlab-code-formatter',
    'tox',
    'setuptools-scm',
]

[project.urls]
homepage = "https://www.example.com/airim"

# documentation = ""
# issues        = ""
# changelog     = ""
[tool.setuptools_scm]
# not needed
write_to = "airsim/_version.py"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["airsim*"]
exclude = ["*sanity_checks*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["test"]

[tool.isort]
# .pre-commit-config.yaml will read from there
profile = "black"
src_paths = ["airsim", "test"]
sections = "FUTURE,STDLIB,FIRSTPARTY,THIRDPARTY,TESTS,AIRSIM,LOCALFOLDER"
extra_standard_library = "tomllib"
known_tests = "pytest"
known_airsim = "airsim"

[tool.flake8]
# remember to sync with .pre-commit-config.yaml
ignore = ['E203', 'W503']
skip_glob = ["*.npz"]
max-line-length = 110 # black will take care of most of this
count = true

[tool.cython-lint]
max-line-length = 110
ignore = ['E503', 'E504', 'E741']
